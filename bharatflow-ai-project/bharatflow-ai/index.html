<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BharatFlow AI</title>
<style>
:root{--bg:#fff;--ink:#14213d;--mu:#5b6478;--ln:#e3e6ec;--soft:#f6f7f9;--pri:#1f3a6e;--on:#fff;--ok:#15762b;--warn:#c2410c;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--ink:#eef1f7;--mu:#98a2b8;--ln:#252d40;--soft:#171e2e;--pri:#8fb0ff;--on:#0f1420;--ok:#4ade80;--warn:#fb923c;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0f1420;--ink:#eef1f7;--mu:#98a2b8;--ln:#252d40;--soft:#171e2e;--pri:#8fb0ff;--on:#0f1420;--ok:#4ade80;--warn:#fb923c;--bad:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--ln);z-index:5}
header.a{background:var(--pri);border-color:var(--pri);color:var(--on)}header.a .logo span,header.a nav button,header.a a{color:var(--on)}header.a nav button.on{background:rgba(255,255,255,.18)}
.bar{max-width:1080px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px}.logo span{color:var(--pri)}.logo small{font-weight:500;opacity:.75;margin-left:6px}
nav{display:flex;gap:4px;flex:1}nav button,.btn{font:inherit;border:1px solid transparent;background:none;color:var(--mu);padding:6px 12px;border-radius:6px;cursor:pointer}
nav button.on{color:var(--pri);background:var(--soft);font-weight:600}
.btn{border-color:var(--ln);color:var(--ink)}.btn.p{background:var(--pri);color:var(--on);border-color:var(--pri)}.btn.s{padding:3px 9px;font-size:13px}.btn:disabled{opacity:.5}
a{color:var(--pri);cursor:pointer;text-decoration:none}
select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;width:100%}
main{max-width:1080px;margin:auto;padding:26px 20px 60px}
h1{font-size:clamp(28px,5vw,42px);line-height:1.15;letter-spacing:-.02em;margin:0 0 12px}h2{font-size:21px;margin:0 0 6px}h3{font-size:15px;margin:0 0 6px}
p{margin:0 0 12px}.mu{color:var(--mu)}.sm{font-size:13px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--ln);border-radius:99px;padding:1px 9px;color:var(--mu)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{border:1px solid var(--ln);border-radius:10px;padding:18px;background:var(--bg)}
.kpi b{display:block;font-size:28px}.kpi span{color:var(--mu);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--ln);font-size:14px}th{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.p1{color:var(--bad)}.p2{color:var(--warn)}.p3{color:var(--pri)}.p4{color:var(--ok)}.pb{font-weight:700}
.bar2{height:8px;border-radius:4px;background:var(--pri);opacity:.85}.br{display:grid;grid-template-columns:130px 1fr 28px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.tl{margin:10px 0 0;padding:0;list-style:none;border-left:2px solid var(--ln)}.tl li{padding:0 0 8px 12px;font-size:13px;color:var(--mu)}.tl b{color:var(--ink)}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
.f{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.f select{width:auto}
img.th{width:84px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--ln)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}#toast.on{opacity:1}
.feed{max-width:520px;margin:0 auto;display:grid;gap:18px}.post{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--bg)}.ph2{display:flex;gap:10px;align-items:center;padding:12px 14px}
.av{width:38px;height:38px;border-radius:50%;background:var(--pri);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none}
.media{display:flex;gap:2px;background:var(--ln)}.media .m{position:relative;flex:1;min-width:0}.media img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.media span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.media.ph{aspect-ratio:1.6;align-items:center;justify-content:center;background:var(--soft);color:var(--mu);font-weight:600}.cap{padding:12px 14px 14px}
.reels{max-width:400px;margin:0 auto;height:calc(100dvh - 250px);min-height:420px;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:12px}.reels .post{height:100%;scroll-snap-align:start;display:flex;flex-direction:column;border-radius:0}.reels .media{flex:1;min-height:0}.reels .media img{height:100%;aspect-ratio:auto}
.note{background:var(--soft);border-bottom:1px solid var(--ln);text-align:center;font-size:13px;color:var(--mu);padding:6px 12px}
.post{padding:0;overflow:hidden;max-width:560px;width:100%;margin:auto}.ph{display:flex;align-items:center;gap:10px;padding:12px 14px}.av{width:38px;height:38px;border-radius:50%;background:var(--pri);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none}
.md{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;position:relative;background:var(--soft)}.md img{width:100%;height:240px;object-fit:cover;display:block}.md i{position:absolute;top:8px;left:8px;font-style:normal;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:2px 8px;border-radius:99px}.md i.r{left:auto;right:8px}
.nomd{height:160px;display:grid;place-items:center;background:var(--soft);color:var(--mu);font-weight:600;padding:10px;text-align:center}.pb2{padding:10px 14px 14px}.hb{font:inherit;font-size:20px;background:none;border:0;cursor:pointer;color:var(--ink);padding:0}.hb.on{color:var(--bad)}
.stories{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:16px}.sty{flex:none;width:66px;text-align:center;font-size:11px;color:var(--mu);cursor:pointer}.sty div{width:58px;height:58px;margin:0 auto 4px;border-radius:50%;border:2px solid var(--ok);display:grid;place-items:center;font-weight:700;color:var(--ink);background:var(--soft)}
</style></head><body>
<div id="nt"></div><div id="hd"></div><main id="app"></main><div id="toast" role="status"></div>
<script>
const CATS={"Pothole":"Road Maintenance","Road damage":"Road Maintenance","Garbage overflow":"Sanitation","Water leakage":"Water Board","Waterlogging / flooding":"Drainage","Open manhole":"Drainage","Broken streetlight":"Electrical","Electrical hazard":"Electrical","Damaged traffic signal":"Traffic Police","Fallen tree":"Parks & Horticulture","Other":"General Administration"};
const ST=["REPORTED","ASSIGNED","IN PROGRESS","RESOLVED"],SEV=["","Minor","Moderate","Dangerous"],PLC=[["Residential street",.3],["Busy road or market",.7],["Near school, hospital or public place",1]];
const LN=["","P1 Critical","P2 High","P3 Medium","P4 Low"];
let C=[],ME="guest",ADMIN=false,mem=true,tab="",ready=false,PR=null,fst="",fmode="feed";const rt=c=>(c.log||[]).slice(-1)[0]?.t||c.at;const STATES="Andhra Pradesh|Arunachal Pradesh|Assam|Bihar|Chhattisgarh|Goa|Gujarat|Haryana|Himachal Pradesh|Jharkhand|Karnataka|Kerala|Madhya Pradesh|Maharashtra|Manipur|Meghalaya|Mizoram|Nagaland|Odisha|Punjab|Rajasthan|Sikkim|Tamil Nadu|Telangana|Tripura|Uttar Pradesh|Uttarakhand|West Bengal|Andaman and Nicobar Islands|Chandigarh|Dadra and Nagar Haveli and Daman and Diu|Delhi|Jammu and Kashmir|Ladakh|Lakshadweep|Puducherry".split("|");const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.className="on";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",2600)};
const norm=s=>String(s).trim().toLowerCase();
const dens=c=>Math.min(1,C.filter(x=>x.id!=c.id&&x.cat==c.cat&&norm(x.area)==norm(c.area)&&x.st<4).length/4);
const age=c=>Math.max(0,(Date.now()-c.at)/864e5);
const F=c=>[["Severity",c.sev/3*30,30],["Safety risk",c.risk/3*30,30],["Report density",dens(c)*15,15],["Location impact",c.loc*15,15],["Complaint age",Math.min(age(c)/14,1)*10,10]];
const score=c=>Math.round(F(c).reduce((a,x)=>a+x[1],0)),lvl=s=>s>=80?1:s>=60?2:s>=40?3:4;
const dt=t=>new Date(t).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});
async function save(c){c.log=c.log||[];const i=C.findIndex(x=>x.id==c.id);
 try{if(!mem){await window.__db.doc("complaints/"+c.id).set(JSON.parse(JSON.stringify(c)))}else{i<0?C.unshift(c):C[i]=c;render()}return true}catch(e){toast("Could not save: "+(e.message||"permission denied"));return false}}
const log=(c,note)=>{c.log=[...(c.log||[]),{t:Date.now(),s:ST[c.st-1],n:note||""}]};
async function init(){
 try{const u=window.claude&&await claude.use("user");if(u){ME=(await u.id())||"guest";ADMIN=!!(await u.canEdit())}}catch(e){}
 try{const db=window.claude&&await claude.use("db");if(db){window.__db=db;mem=false;db.collection("complaints").onSnapshot(s=>{C=s.docs.map(d=>({...d.data(),id:d.id}));if(!(location.hash=="#/citizen"&&tab=="report"))render()},()=>toast("Live sync interrupted"))}}catch(e){}
 if(mem){ADMIN=true}else{try{const s=await window.__db.doc("data/users/"+ME+"/profile").get();if(s.exists)PR=s.data()}catch(e){}}ready=true;render()}
addEventListener("hashchange",()=>{tab="";render()});
function shell(kind,tabs){const a=kind=="a";$("#hd").innerHTML=`<header class="${a?"a":""}"><div class="bar"><div class="logo">Bharat<span>Flow</span> AI<small>${a?"Authority Console":"Citizen Portal"}</small></div><nav>${tabs.map(([k,n])=>`<button class="${tab==k?"on":""}" data-k="${k}">${n}</button>`).join("")}</nav>${PR?`<span class="sm">${esc(PR.name)}</span>`:""}<a href="#/">Switch portal</a></div></header>`;
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;render()})}
function render(){const h=location.hash.replace("#/",""),app=$("#app");if(!ready){app.innerHTML='<div class="empty">Loading…</div>';return}
 $("#nt").innerHTML=mem?`<div class="note">Storage not connected in this view — data stays in this browser tab only. Open the published link to use shared, live storage.</div>`:"";
 if(h.startsWith("login/")){app.replaceChildren(gate(h.split("/")[1]));return}
 if((h=="citizen"||h=="authority")&&(!PR||(h=="citizen"?!PR.state:!PR.dept))){location.hash="#/login/"+h;return}
 if(h=="citizen"){tab=tab||"feed";shell("c",[["feed","Solved problems"],["report","Report a problem"],["mine","My complaints"]]);app.replaceChildren(citizen())}
 else if(h=="authority"){tab=tab||"queue";shell("a",[["queue","Complaint queue"],["insights","Insights"]]);app.replaceChildren(authority())}
 else{$("#hd").innerHTML=`<header><div class="bar"><div class="logo">Bharat<span>Flow</span> AI</div></div></header>`;app.replaceChildren(home())}}
const T=h=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild};
function home(){return T(`<div style="max-width:720px;padding-top:30px"><span class="tag">Civic infrastructure intelligence</span><h1 style="margin-top:14px">From Civic Complaints to Civic Intelligence.</h1><p class="mu" style="font-size:18px">Citizens register real problems. Authorities prioritise, resolve and close them with citizen feedback. Nothing here is pre-filled.</p>
<div class="grid g2" style="margin-top:22px"><div class="card"><h3>I am a citizen</h3><p class="mu sm">Report a problem, follow its progress and give feedback once it is resolved.</p><a class="btn p" href="#/login/citizen">Sign in as citizen</a></div><div class="card"><h3>I am an authority officer</h3><p class="mu sm">Work the priority queue, assign, resolve and review feedback.</p><a class="btn" href="#/login/authority">Sign in as officer</a></div></div></div>`)}
function tline(c){return `<ul class="tl">${(c.log||[]).map(l=>`<li><b>${esc(l.s)}</b> · ${dt(l.t)}${l.n?"<br>"+esc(l.n):""}</li>`).join("")}</ul>`}
function citizen(){
 if(tab=="feed")return feed();
 if(tab=="report"){const n=T(`<div class="card" style="max-width:640px"><h2>Report a problem</h2><p class="mu sm">Your report goes straight to the authority queue.</p>
 <label>Problem type</label><select id="cat">${Object.keys(CATS).map(c=>`<option>${c}</option>`).join("")}</select>
 <label>Describe the problem</label><textarea id="d" rows="3"></textarea>
 <label>State / UT</label><select id="st">${STATES.map(x=>`<option ${x==PR?.state?"selected":""}>${x}</option>`).join("")}</select><label>City / area / locality</label><input id="ar" placeholder="Type your city and area">
 <label>Street or landmark</label><input id="lm">
 <div class="row" style="margin-top:8px"><button class="btn s" id="gps" type="button">Use my GPS location</button><span class="sm mu" id="ll"></span></div>
 <label>How serious is it?</label><select id="sv"><option value="1">Minor inconvenience</option><option value="2" selected>Moderate — needs attention soon</option><option value="3">Dangerous — risk of injury or damage</option></select>
 <label>Where is it?</label><select id="pl">${PLC.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join("")}</select>
 <label>Photo (optional)</label><input type="file" id="ph" accept="image/*">
 <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="pub" checked style="width:auto"> Show my name on the public solved-problems feed</label><div class="row"><button class="btn p" id="go">Submit complaint</button></div></div>`);let ll=null;
 n.querySelector("#gps").onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{ll=[p.coords.latitude,p.coords.longitude];n.querySelector("#ll").textContent=ll.map(x=>x.toFixed(4)).join(", ")},()=>toast("Location permission denied")):toast("GPS not available");
 n.querySelector("#go").onclick=async e=>{const q=s=>n.querySelector(s),d=q("#d").value.trim(),ar=q("#ar").value.trim();if(d.length<8||!ar)return toast("Please add a description and your area");
  e.target.disabled=true;let ph="";const f=q("#ph").files[0];
  if(f){if(f.size>8e6){toast("Photo must be under 8 MB");e.target.disabled=false;return}try{const as=window.claude&&await claude.use("assets");if(as)ph=(await as.upload(f)).id;else toast("Photo storage unavailable — submitting without photo")}catch(x){toast("Photo upload failed — submitting without photo")}}
  const sv=+q("#sv").value,pl=PLC[+q("#pl").value][1];
  const c={id:"BF-"+Date.now().toString(36).toUpperCase().slice(-6),by:ME,cat:q("#cat").value,desc:d,area:ar,lm:q("#lm").value.trim(),ll,sev:sv,risk:pl==1?3:Math.max(1,sv-(sv==3?0:1)),loc:pl,ph,state:q("#st").value,pn:q("#pub").checked&&PR?PR.name:"A citizen",st:1,at:Date.now()};log(c,"Complaint registered");
  if(await save(c)){toast("Complaint "+c.id+" registered");tab="mine";render()}else e.target.disabled=false};return n}
 const L=C.filter(c=>c.by==ME||mem).sort((a,b)=>b.at-a.at);
 const w=T(`<div><h2>My complaints</h2><p class="mu sm">Track each report and give feedback when work is completed.</p><div class="grid" id="l" style="margin-top:14px"></div></div>`);const l=w.querySelector("#l");
 if(!L.length)l.innerHTML=`<div class="card empty">You have not registered any complaints yet.</div>`;
 L.forEach(c=>{const s=score(c),k=T(`<div class="card"><div class="row" style="margin:0;justify-content:space-between"><h3 style="margin:0">${esc(c.cat)} · ${esc(c.area)}</h3><span class="tag">${ST[c.st-1]}</span></div><p class="sm mu" style="margin:6px 0">${c.id} · ${dt(c.at)} · <span class="pb p${lvl(s)}">${LN[lvl(s)]}</span></p><p style="margin:6px 0">${esc(c.desc)}</p>${c.ph?`<img class="th" src="/_blob/${esc(c.ph)}" alt="">`:""}${tline(c)}</div>`);
  if(c.st==4){if(c.fb)k.append(T(`<p class="sm" style="margin:8px 0 0;color:var(--ok)">Thank you — feedback submitted (${c.fb.rating}/5${c.fb.fixed?", confirmed fixed":""}).</p>`));else{const f=T(`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--ln)"><h3>Is the problem fixed?</h3><select class="fx"><option value="1">Yes, it is fixed</option><option value="0">No, the problem is still there</option></select><label>Rating of the work</label><select class="rt">${[5,4,3,2,1].map(r=>`<option>${r}</option>`).join("")}</select><label>Comments (optional)</label><textarea rows="2" class="cm"></textarea><div class="row"><button class="btn p s">Submit feedback</button></div></div>`);
   f.querySelector("button").onclick=async()=>{const fixed=f.querySelector(".fx").value=="1";c.fb={fixed,rating:+f.querySelector(".rt").value,comment:f.querySelector(".cm").value.trim().slice(0,500),at:Date.now()};if(!fixed){c.st=3;log(c,"Reopened by citizen: work not satisfactory")}else log(c,"Citizen confirmed the fix");if(await save(c))toast(fixed?"Thanks for your feedback":"Complaint reopened")};k.append(f)}}
  l.append(k)});return w}
function authority(){
 if(!ADMIN)return T(`<div class="card empty"><h3>Authority access required</h3><p class="sm">Ask the page owner to give your account Editor access, or use the <a href="#/citizen">citizen portal</a>.</p></div>`);
 if(tab=="insights"){const cnt=f=>{const m={};C.forEach(c=>{const k=f(c);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};const bars=a=>a.length?(mx=>a.map(x=>`<div class="br"><span>${esc(x[0])}</span><div><div class="bar2" style="width:${x[1]/mx*100}%"></div></div><span>${x[1]}</span></div>`).join(""))(Math.max(...a.map(x=>x[1]))):`<p class="mu sm">No data yet.</p>`;
  const g={};C.filter(c=>c.st<4).forEach(c=>{const k=c.cat+"|"+norm(c.area);(g[k]=g[k]||[]).push(c)});const cl=Object.values(g).filter(a=>a.length>=2).sort((a,b)=>b.length-a.length);
  return T(`<div><h2>Insights</h2><p class="mu sm">Computed only from complaints registered on this platform.</p><div class="card" style="margin:14px 0"><h3>Emerging clusters</h3>${cl.length?cl.map(a=>`<p class="sm" style="margin:8px 0"><b>${esc(a[0].cat)}</b> in <b>${esc(a[0].area)}</b> — ${a.length} open reports. Consider a proactive inspection.</p>`).join(""):`<p class="mu sm">A cluster appears when two or more open complaints of the same type come from one area.</p>`}</div>
  <div class="grid g2"><div class="card"><h3>By category</h3>${bars(cnt(c=>c.cat))}</div><div class="card"><h3>By area</h3>${bars(cnt(c=>c.area.trim()))}</div><div class="card"><h3>By status</h3>${bars(cnt(c=>ST[c.st-1]))}</div><div class="card"><h3>Citizen ratings</h3>${bars(cnt(c=>c.fb?c.fb.rating+" star":null).filter(x=>x[0]!="null"))}</div></div></div>`)}
 const open=C.filter(c=>c.st<4),rs=C.filter(c=>c.st==4),fb=C.filter(c=>c.fb),avg=fb.length?(fb.reduce((a,c)=>a+c.fb.rating,0)/fb.length).toFixed(1):"—";
 const n=T(`<div><div class="grid g3">${[["Total",C.length],["Open",open.length],["Critical open",open.filter(c=>lvl(score(c))==1).length],["Resolved",rs.length],["Avg. rating",avg]].map(k=>`<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join("")}</div>
 <div class="f" style="margin-top:16px"><select id="fs"><option value="">All statuses</option>${ST.map((s,i)=>`<option value="${i+1}">${s}</option>`).join("")}</select></div>
 <div class="card wrap" style="padding:0"><table><thead><tr><th>ID</th><th>Problem</th><th>Area</th><th>Priority</th><th>Status</th><th>Age</th><th></th></tr></thead><tbody id="tb"></tbody></table></div><div id="pn"></div></div>`);
 let sel=null;const draw=()=>{const v=n.querySelector("#fs").value,tb=n.querySelector("#tb"),L=C.filter(c=>!v||c.st==v).sort((a,b)=>score(b)-score(a));tb.innerHTML=L.length?"":`<tr><td colspan=7 class="empty">No complaints yet. They appear here as soon as citizens register them.</td></tr>`;
  L.forEach(c=>{const s=score(c),r=T(`<tr><td>${c.id}</td><td>${esc(c.cat)}</td><td>${esc(c.area)}</td><td class="pb p${lvl(s)}">${LN[lvl(s)].split(" ")[0]} · ${s}</td><td>${ST[c.st-1]}</td><td>${Math.floor(age(c))}d</td><td></td></tr>`),b=T(`<button class="btn s">Open</button>`);b.onclick=()=>{sel=c.id;pn()};r.lastChild.append(b);tb.append(r)})};
 const pn=()=>{const p=n.querySelector("#pn");p.innerHTML="";const c=C.find(x=>x.id==sel);if(c){p.append(detail(c));p.scrollIntoView({behavior:"smooth"})}};
 n.querySelector("#fs").onchange=draw;draw();if(sel)pn();return n}
function detail(c){const s=score(c),n=T(`<div class="card" style="margin-top:16px"><h2>${c.id} · ${esc(c.cat)}</h2><p class="sm mu">${esc(c.area)}${c.lm?", "+esc(c.lm):""}${c.ll?" · GPS "+c.ll.map(x=>x.toFixed(4)).join(", "):""} · ${ST[c.st-1]} · <b class="p${lvl(s)}">${LN[lvl(s)]}</b> (${s}/100)</p><p>${esc(c.desc)}</p>${c.ph?`<img class="th" src="/_blob/${esc(c.ph)}" alt="">`:""}<h3 style="margin-top:12px">Why this priority</h3>${F(c).map(x=>`<div class="br"><span>${x[0]}</span><div><div class="bar2" style="width:${x[1]/x[2]*100}%"></div></div><span>${Math.round(x[1])}</span></div>`).join("")}<h3>History</h3>${tline(c)}${c.fb?`<p class="sm"><b>Citizen feedback:</b> ${c.fb.rating}/5${c.fb.comment?" — "+esc(c.fb.comment):""}</p>`:""}<div class="row" id="ac"></div></div>`),ac=n.querySelector("#ac");
 const go=async(st,note)=>{c.st=st;log(c,note);if(await save(c))toast("Status: "+ST[st-1])};
 if(c.st==1){ac.innerHTML=`<input id="dp" value="${CATS[c.cat]||""}" style="max-width:240px" aria-label="Department"><button class="btn p">Assign</button>`;ac.querySelector("button").onclick=()=>{const d=ac.querySelector("#dp").value.trim()||"department";c.dept=d;go(2,"Assigned to "+d)}}
 else if(c.st==2){ac.innerHTML=`<button class="btn p">Start work</button>`;ac.querySelector("button").onclick=()=>go(3,"Work started")}
 else if(c.st==3){ac.innerHTML=`<input id="on" placeholder="Officer name (shown publicly)" style="max-width:230px"><input id="nt2" placeholder="Action taken" style="max-width:260px"><input type="file" id="rp" accept="image/*" style="max-width:240px"><button class="btn p">Mark resolved</button>`;ac.querySelector("button").onclick=async e=>{const f=ac.querySelector("#rp").files[0];let note=ac.querySelector("#nt2").value.trim()||"Work completed";const on=ac.querySelector("#on").value.trim();if(!on)return toast("Please enter the officer name");c.rby=on.slice(0,40);c.rat=Date.now();c.rnote=note.slice(0,300);if(f){try{const as=window.claude&&await claude.use("assets");if(as){c.rph=(await as.upload(f)).id}}catch(x){toast("Photo upload failed")}}go(4,note+(c.rph?" (resolution photo attached)":""))}}
 else ac.innerHTML=`<span class="sm mu">${c.fb?"Closed with citizen feedback.":"Awaiting citizen feedback."}</span>`;
 if(c.rph)ac.before(T(`<div><h3>Resolution photo</h3><img class="th" src="/_blob/${esc(c.rph)}" alt=""></div>`));return n}
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?"just now":m<60?m+"m ago":m<1440?Math.floor(m/60)+"h ago":Math.floor(m/1440)+"d ago"};
async function saveProfile(p){try{if(!mem)await window.__db.doc("data/users/"+ME+"/profile").set({...(PR||{}),...p});PR={...(PR||{}),...p};return true}catch(e){toast("Could not save profile: "+(e.message||"denied"));return false}}
function gate(role){const a=role=="authority";$("#hd").innerHTML=`<header class="${a?"a":""}"><div class="bar"><div class="logo">Bharat<span>Flow</span> AI<small>${a?"Officer":"Citizen"} sign-in</small></div><nav></nav><a href="#/">Back</a></div></header>`;
 let edit=!PR||(a?!PR.dept:!PR.state);const n=T(`<div class="card" style="max-width:460px;margin:auto"><h2>${a?"Officer sign-in":"Citizen sign-in"}</h2><p class="mu sm">Register once with your email or mobile number. Your contact details stay private to your account.</p><div id="w"></div><p class="sm" style="margin-top:14px"><a id="fg">Forgot password?</a></p><p class="sm mu" id="fp" hidden>This prototype stores no passwords. Your sign-in is handled by your claude.ai account, so use that account's own password reset. Email or SMS one-time-code recovery needs a backend service and is not part of this prototype.</p></div>`);
 n.querySelector("#fg").onclick=()=>{const f=n.querySelector("#fp");f.hidden=!f.hidden};
 const draw=()=>{const w=n.querySelector("#w");w.innerHTML="";
  if(!edit){w.append(T(`<div><p>Signed in as <b>${esc(PR.name)}</b><br><span class="sm mu">${esc(PR.contact)}</span></p><div class="row"><button class="btn p" id="ct">Continue to ${a?"authority console":"citizen portal"}</button><button class="btn" id="ed">Update details</button></div></div>`));w.querySelector("#ct").onclick=()=>location.hash="#/"+role;w.querySelector("#ed").onclick=()=>{edit=true;draw()};return}
  const f=T(`<div><label>Full name</label><input id="nm" value="${esc(PR?.name||"")}"><label>Register with</label><select id="ty"><option value="email">Email address</option><option value="phone">Mobile number (India)</option></select><label>Email or mobile number</label><input id="cv"><label>${a?"Department":"State / UT"}</label>${a?`<input id="ex" value="${esc(PR?.dept||"")}">`:`<select id="ex">${STATES.map(x=>`<option ${x==PR?.state?"selected":""}>${x}</option>`).join("")}</select>`}<div class="row"><button class="btn p" id="sv">Register &amp; continue</button></div><p class="sm mu">Contact details are format-checked only, not verified by code.</p></div>`);
  f.querySelector("#sv").onclick=async()=>{const q=x=>f.querySelector(x).value.trim(),nm=q("#nm"),ty=q("#ty"),ex=q("#ex");let c=q("#cv");
   if(nm.length<2)return toast("Enter your full name");
   if(ty=="email"){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c))return toast("Enter a valid email address")}else{c=c.replace(/[\s-]/g,"").replace(/^(\+91|0)/,"");if(!/^[6-9]\d{9}$/.test(c))return toast("Enter a valid 10-digit mobile number");c="+91 "+c}
   if(!ex)return toast(a?"Enter your department":"Choose your state");
   if(await saveProfile({name:nm,contact:c,type:ty,[a?"dept":"state"]:ex,at:Date.now()}))location.hash="#/"+role};w.append(f)};
 draw();return n}
function feed(){const all=C.filter(c=>c.st==4),D=all.filter(c=>!fst||c.state==fst).sort((a,b)=>rt(b)-rt(a)),sts=new Set(all.map(c=>c.state).filter(Boolean));
 const w=T(`<div><h2>Problems solved across India</h2><p class="mu sm"><b>${all.length}</b> resolved${sts.size?` in <b>${sts.size}</b> state${sts.size>1?"s/UTs":"/UT"}`:""}. Real complaints, fixed by authorities.</p><div class="f" style="margin-top:12px"><select id="fs2"><option value="">All India</option>${STATES.map(x=>`<option ${x==fst?"selected":""}>${x}</option>`).join("")}</select><button class="btn s ${fmode=="feed"?"p":""}" data-m="feed">Feed</button><button class="btn s ${fmode=="reels"?"p":""}" data-m="reels">Reels</button></div><div class="${fmode}" id="fd"></div></div>`),d=w.querySelector("#fd");
 w.querySelector("#fs2").onchange=e=>{fst=e.target.value;render()};w.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{fmode=b.dataset.m;render()});
 if(!D.length)d.innerHTML=`<div class="card empty">No solved problems to show yet. They appear here once authorities resolve citizen complaints.</div>`;
 D.forEach(c=>{const nm=c.pn||"A citizen",lk=(c.likes||[]).includes(ME),note=(c.log||[]).slice(-1)[0]?.n||"",im=(id,l)=>id?`<div class="m"><img src="/_blob/${esc(id)}" alt="${l}"><span>${l}</span></div>`:"";
  const p=T(`<article class="post"><div class="ph2"><div class="av">${esc(nm[0].toUpperCase())}</div><div><b>${esc(nm)}</b><div class="sm mu">${esc(c.area)}${c.state?", "+esc(c.state):""}</div></div><span class="sm mu" style="margin-left:auto">${ago(rt(c))}</span></div>${c.ph||c.rph?`<div class="media">${im(c.ph,"Before")}${im(c.rph,"After")}</div>`:`<div class="media ph">${esc(c.cat)}</div>`}<div class="cap"><div class="row" style="margin:0 0 6px"><button class="btn s lk">${lk?"♥":"♡"} ${(c.likes||[]).length}</button>${c.fb?`<span class="sm mu">Rated ${c.fb.rating}/5 by the citizen</span>`:""}</div><p style="margin:0 0 6px"><b>${esc(nm)}</b> ${esc(c.desc)}</p><p class="sm" style="margin:0;color:var(--ok)">✓ Resolved${(c.rby||c.dept)?" by "+esc(c.rby||c.dept):""}${note?" — "+esc(note):""}</p></div></article>`);
  p.querySelector(".lk").onclick=async()=>{const L=(c.likes||[]).filter(x=>x!=ME);if(!lk)L.push(ME);c.likes=L;try{if(mem)render();else await window.__db.doc("complaints/"+c.id).update({likes:L})}catch(e){toast("Could not save like")}};d.append(p)});return w}
render();init();
</script></body></html>
